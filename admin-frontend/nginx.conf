server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # xlsx-прайсы бывают до ~10 МБ
  client_max_body_size 30m;

  # Админ-API живёт в backend-v2 (тот же origin — кука httpOnly работает без CORS)
  location /api/ {
    proxy_pass http://backend-v2:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s; # прогон цен и pg_dump занимают время
  }

  location / {
    try_files $uri /index.html;
  }
}
