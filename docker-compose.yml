version: "3.8"

services:
  db:
    image: postgres:15
    container_name: my_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: my_backend_container
    restart: always
    env_file:
      - ./backend/.env.production
    ports:
      - "5000:5000"
    depends_on:
      - db

  admin-backend:
    build: ./admin-backend
    container_name: my_admin_backend
    restart: always
    env_file:
      - ./admin-backend/.env.production
    ports:
      - "5001:5001"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: my_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - /var/www/images:/var/www/images:ro
    depends_on:
      - backend

  admin-frontend:
    build: ./admin-frontend
    container_name: my_admin_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - admin-backend

  # ─── v2 stack ───────────────────────────────────────────────
  backend-v2:
    build: ./backend-v2
    container_name: my_backend_v2
    restart: always
    env_file:
      - ./backend-v2/.env.production
    ports:
      - "5002:5001"
    volumes:
      - /var/www/images:/var/www/images:ro
    depends_on:
      - db

  frontend-v2:
    build: ./frontend-v2
    container_name: my_frontend_v2
    restart: always
    environment:
      - API_URL=http://backend-v2:5001
      - PUBLIC_API_URL=
      - HOST=0.0.0.0
      - PORT=4321
    ports:
      - "4321:4321"
    volumes:
      - /var/www/images:/var/www/images:ro
    depends_on:
      - backend-v2

volumes:
  postgres_data:
